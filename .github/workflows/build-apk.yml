name: Compilar APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.GENVIA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/genvia.jks"
            echo "GENVIA_KEYSTORE_PATH=$RUNNER_TEMP/genvia.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret GENVIA_KEYSTORE_B64: el APK se firma con una llave temporal y no se podrá actualizar encima."
          fi

      - name: Compilar APK
        env:
          GENVIA_KEYSTORE_PASSWORD: ${{ secrets.GENVIA_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GenVia.apk

      - name: Verificar firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs GenVia.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          if [ -n "$GENVIA_KEYSTORE_PATH" ] && "$APKSIGNER" verify --print-certs GenVia.apk | grep -q "CN=Android Debug"; then
            echo "::error::El APK quedó firmado con la llave temporal aunque hay llave fija." && exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GenVia-apk
          path: GenVia.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GenVia build ${{ github.run_number }}${{ github.ref_name != 'main' && format(' (prueba {0})', github.ref_name) || '' }}
          target_commitish: ${{ github.sha }}
          files: GenVia.apk
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
